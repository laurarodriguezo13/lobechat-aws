name: CI — Build-free Static Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    name: Static Analysis Gates
    runs-on: ubuntu-latest

    steps:
      # Full history needed by gitleaks (secret scan over entire git log)
      # and by cz check --rev-range (conventional-commit lint of new commits).
      # Default shallow clone would make both gates scan nothing or fail.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Gate 1: hadolint ──────────────────────────────────────────────────
      # Lints both Dockerfiles for best-practice violations (e.g. unpinned
      # FROM tags, USER root in runtime image, installing unnecessary packages).
      # continue-on-error: this repo has known findings (mcphub FROM :latest,
      # sandbox installs docker.io/gcc into runtime) — warn rather than block
      # so all other gates still run and the run stays visible.
      - name: hadolint — dockerfiles/mcphub.Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: dockerfiles/mcphub.Dockerfile
        continue-on-error: true

      - name: hadolint — dockerfiles/sandbox.Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: dockerfiles/sandbox.Dockerfile
        continue-on-error: true

      # ── Gate 2: docker compose config ─────────────────────────────────────
      # Validates docker-compose.yml schema and variable interpolation WITHOUT
      # starting or building anything.  docker-compose.yml references many
      # ${VAR} secrets (NEXT_AUTH_SECRET, KEY_VAULTS_SECRET, HF_TOKEN, etc.)
      # that are undefined in CI — config -q would fail with "variable is not set".
      # We copy .env.example → .env to supply placeholder values.
      # SAFE: .env.example contains no real secrets (placeholder strings only),
      # and .gitignore already excludes .env so the copy is never committed.
      - name: docker compose config — validate without running
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q

      # ── Gate 3: yamllint ──────────────────────────────────────────────────
      # Checks YAML syntax on the Compose file and this workflow itself.
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -d relaxed docker-compose.yml .github/workflows/ci.yml

      # ── Gate 4: actionlint ────────────────────────────────────────────────
      # Validates this workflow file against the GitHub Actions schema
      # (catches wrong action inputs, missing required fields, type errors).
      - name: actionlint
        uses: rhysd/actionlint@v1.7.7

      # ── Gate 5: gitleaks ──────────────────────────────────────────────────
      # Scans the working tree and full git history for committed secrets.
      # Note: .gitignore already excludes .env, *.pem, config/ssh/ and
      # aws_credentials.yaml, so a clean tree will not trigger — any finding
      # here means a real secret reached the history.
      - name: gitleaks — secret scan
        uses: gitleaks/gitleaks-action@v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ── Gate 6: trivy fs + config ─────────────────────────────────────────
      # Installed via the official install script (not a marketplace action,
      # so no action-pin requirement applies here).
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: trivy — fs scan (vulnerabilities)
        run: trivy fs --exit-code 0 --format table .

      # Inspects Dockerfiles and docker-compose.yml for misconfigurations
      # (e.g. USER root, no HEALTHCHECK, privileged containers).
      # continue-on-error: real findings exist in this repo (mcphub USER root,
      # sandbox NOPASSWD sudo) — warn only so the run stays informative.
      - name: trivy — config scan (misconfigurations)
        run: trivy config --exit-code 0 --format table .
        continue-on-error: true

      # ── Gate 7: commitizen conventional-commit check ──────────────────────
      # Mirrors the local gate in .githooks/commit-msg (which uses
      # --commit-msg-file, a file path that does not exist in CI).
      # We use --rev-range origin/main..HEAD to lint only new commits on this
      # branch — an unbounded check would go red on the repo's pre-existing
      # non-conventional commits.
      # uv is already declared in [tool.commitizen] via pyproject.toml.
      #
      # NOTE: tests/ are deliberately excluded from this pipeline.
      # tests/test_vllm.py, tests/test_hayhooks.py, etc. are live-stack
      # integration tests — they import openai / httpx and hit running
      # endpoints (vLLM /health, hayhooks /docs, etc.) that do not exist on a
      # standard GitHub runner. Running them here would always fail and is
      # explicitly prohibited by the exam's hard rule.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: commitizen — conventional commit check (new commits only)
        run: uv run cz check --rev-range origin/main..HEAD
